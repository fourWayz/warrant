[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./deployments" }, { access = "read-write", path = "./deployments" }]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "safe-smart-account/=lib/safe-smart-account/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[invariant]
# Verified once at Foundry's full defaults (256 runs x 500 calls = 128,000
# calls per invariant, three invariants, zero violations, ~7 minutes) — see
# docs/m5-verifier.md. Set lower here so a routine `forge test` stays fast;
# run with `--match-contract WarrantRegistryInvariantsTest` and no runs/depth
# override to reproduce the full campaign.
runs = 100
depth = 200

[rpc_endpoints]
og_testnet = "https://evmrpc-testnet.0g.ai"
og_mainnet = "https://evmrpc.0g.ai"

[etherscan]
# 0G's block explorer is not Etherscan-compatible at time of writing;
# left unconfigured intentionally rather than pointing at a guessed API.
